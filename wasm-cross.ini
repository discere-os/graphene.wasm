# Meson cross-compilation file for WebAssembly (graphene.wasm)
# Based on graphene-wasm-analysis.md production implementation patterns
# Copyright 2025 Superstruct Ltd, New Zealand - Licensed under MIT

[binaries]
c = 'emcc'
ar = 'emar'
ranlib = 'emranlib'

[properties]
c_args = [
  # WASM SIMD128 optimization (modern Emscripten 4.0+)
  '-msimd128',
  
  # Graphene WASM-specific defines
  '-DGRAPHENE_WASM_SIMD=1',
  '-DGRAPHENE_HAS_INTRINSICS=1',
  '-DGRAPHENE_USE_SCALAR=0',
  
  # Performance optimization
  '-O3',
  '-ffast-math',
  '-fstrict-aliasing',
  
  # WASM-specific optimizations
  '-DNDEBUG',
  '-D_GNU_SOURCE'
]

c_link_args = [
  # WASM SIMD support
  '-msimd128',
  
  # Memory configuration for graphics workloads
  '-s', 'INITIAL_MEMORY=64MB',
  '-s', 'MAXIMUM_MEMORY=512MB',
  '-s', 'ALLOW_MEMORY_GROWTH=1',
  
  # Performance settings
  '-O3',
  '-flto',
  
  # Module configuration
  '-s', 'WASM=1',
  '-s', 'MODULARIZE=1',
  '-s', 'EXPORT_ES6=1',
  
  # JavaScript integration
  '-s', 'EXPORTED_RUNTIME_METHODS=["ccall","cwrap","HEAPU8","addFunction","removeFunction"]',
  '-s', 'RESERVED_FUNCTION_POINTERS=10',
  
  # Environment support
  '-s', 'ENVIRONMENT=web,webview,worker,node'
]

[host_machine]
system = 'emscripten'
cpu_family = 'wasm32'
cpu = 'wasm32'
endian = 'little'